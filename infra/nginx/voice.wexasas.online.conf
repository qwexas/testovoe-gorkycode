# «Горький» — voice.wexasas.online (решение Q21).
#
# Схема: Cloudflare (HTTPS) → Cloudflare Tunnel → этот nginx на :80 → контейнеры на 127.0.0.1.
# Установка на сервере:
#   sudo cp infra/nginx/voice.wexasas.online.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/voice.wexasas.online.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# и маршрут voice.wexasas.online → http://localhost:80 в панели Cloudflare (Zero Trust →
# Networks → Tunnels → homeserver → Public Hostname): туннель управляется удалённо.
# Порты 3210/8210 — FRONTEND_PORT/BACKEND_PORT из .env сервера (3100/8100 там заняты).
# Остальные сайты (default, cal, life) этот файл не затрагивает. Certbot не нужен.

# TLS завершается в Cloudflare: если туннель не передал схему, считаем её https.
map $http_x_forwarded_proto $gorky_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

upstream gorky_frontend {
    server 127.0.0.1:3210;
    keepalive 16;
}

upstream gorky_backend {
    server 127.0.0.1:8210;
    keepalive 16;
}

server {
    listen 80;
    # cloudflared ходит на localhost:80, а localhost может разрешиться в ::1 —
    # без IPv6 запрос ушёл бы на сайт по умолчанию (как у соседних vhost-ов).
    listen [::]:80;
    server_name voice.wexasas.online;

    # Голосовые записи — до 10 МБ (контракт /api/voice). Предел nginx чуть выше,
    # чтобы слишком большую запись отклонял бэкенд — ответом 413 в формате API (JSON),
    # а не HTML-страницей nginx.
    client_max_body_size 12m;
    server_tokens off;

    # Базовые заголовки безопасности (TLS завершается в Cloudflare, сайт всегда по https).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Реальный IP клиента: запросы приходят от cloudflared на localhost.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gorky_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Голосовой ход: распознавание + разбор. Бэкенд укладывает его в 85 с и сам отвечает
    # ошибкой, если не успел (ничего не выполнив); здесь — запас сверху, но меньше
    # предела Cloudflare (100 с), чтобы клиент не получил 504 при выполненном действии.
    location = /api/voice {
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;
        proxy_pass http://gorky_backend;
    }

    location /api/ {
        proxy_pass http://gorky_backend;
    }

    location / {
        proxy_pass http://gorky_frontend;
    }
}
