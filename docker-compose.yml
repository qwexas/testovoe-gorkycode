# «Горький»: PostgreSQL + pgvector, FastAPI, Next.js.
# Все порты открыты только на 127.0.0.1 — снаружи сервис доступен через nginx (infra/nginx).
# Порты задаются в .env (FRONTEND_PORT, BACKEND_PORT, DB_PORT): на сервере 3100/8100 заняты.

name: gorky

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gorky
      POSTGRES_USER: gorky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gorky}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorky -d gorky"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      additional_contexts:
        certs: ./infra/certs
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://gorky:${POSTGRES_PASSWORD:-gorky}@db:5432/gorky
      # Веса моделей (эмбеддинги, позже Whisper и Silero) живут в томе, а не в образе:
      # первая загрузка ~2–3 ГБ, дальше — из кэша.
      EMBEDDING_CACHE_DIR: /models
      STT_CACHE_DIR: /models
      TTS_CACHE_DIR: /models/silero
      HF_HOME: /models/hf
      TORCH_HOME: /models/torch
    volumes:
      # Каталог весов с хоста (как ./models при разработке): его заполняет первый старт
      # или infra/deploy/sync-models.sh, чтобы не качать гигабайты заново.
      - ${MODELS_DIR:-./models}:/models
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8100}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      # Первый старт скачивает модель и считает векторы истории — даём до 10 минут.
      start_period: 600s
      start_interval: 5s

  frontend:
    build:
      context: ./frontend
      # Next.js вычисляет rewrites /api → бэкенд при сборке, поэтому адрес — аргумент сборки.
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"

volumes:
  pgdata:
