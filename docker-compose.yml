# «Горький»: PostgreSQL + pgvector, FastAPI, Next.js.
# Все порты открыты только на 127.0.0.1 — снаружи сервис доступен через nginx (infra/nginx).

name: gorky

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gorky
      POSTGRES_USER: gorky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gorky}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorky -d gorky"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      additional_contexts:
        certs: ./infra/certs
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://gorky:${POSTGRES_PASSWORD:-gorky}@db:5432/gorky
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      # Next.js вычисляет rewrites /api → бэкенд при сборке, поэтому адрес — аргумент сборки.
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"

volumes:
  pgdata:
